# Only needed if you set Settings -> Pages -> Source to "GitHub Actions".
# With Source set to "Deploy from a branch" (the simpler option, and what the
# README describes) GitHub builds the site itself and this workflow is unused.
#
# It is dispatch-only because the automatic GITHUB_TOKEN cannot create a Pages
# site: configure-pages fails with "Resource not accessible by integration"
# until a repository admin has enabled Pages once.
name: deploy pages
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
