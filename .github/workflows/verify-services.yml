# Checks the three live open-data services from a runner, using the same URL
# builders the page uses. Dispatch-only: it depends on third-party services, so
# it should never be able to turn the repository's CI red on its own.
name: verify live services
on:
  workflow_dispatch:

jobs:
  services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-live-services.mjs
